<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Booha Blocks</title>

  <link rel="icon" type="image/png" sizes="32x32" href="tetris-tree.png">
  <link rel="apple-touch-icon" href="tetris-tree.png">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pink:#ff7eb9;
      --aqua:#7dd3fc;
      --gold:#ffd166;
      --bg1:#020617;
      --bg2:#000000;
      --neo:#a78bfa;
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at top, #1f2937 0%, var(--bg1) 55%, var(--bg2) 100%);
      font-family:'Noto Sans JP', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color:#f9fafb;
      padding:22px 16px 26px;
    }

    .shell{
      width:min(92vw,520px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      min-height:calc(100vh - 48px);
    }

    .top{
      text-align:center;
      margin-top:4px;
    }

    .title-wrap{
      position:relative;
      display:inline-block;
      padding:10px 16px 14px;
      border-radius:18px;
    }

    .title-wrap::before{
      content:"";
      position:absolute;
      inset:-10px -14px -10px -14px;
      border-radius:22px;
      background:
        linear-gradient(180deg,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0.02) 30%,
          rgba(0,0,0,0.10) 60%,
          rgba(0,0,0,0.22) 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.08) 1px,
          rgba(0,0,0,0.0) 3px,
          rgba(0,0,0,0.0) 6px
        );
      opacity:.55;
      pointer-events:none;
      z-index:-1;
      box-shadow:
        0 0 22px rgba(255,126,185,0.20),
        0 0 40px rgba(125,211,252,0.12);
    }

    .title{
      font-family:'Orbitron', system-ui, sans-serif;
      font-weight:900;
      letter-spacing:.18em;
      font-size:3.25rem;
      line-height:1.0;
      text-transform:uppercase;
      text-shadow:
        0 0 6px rgba(255,255,255,0.95),
        0 0 14px rgba(255,126,185,0.85),
        0 0 26px rgba(125,211,252,0.60),
        0 0 56px rgba(167,139,250,0.35),
        0 10px 0 rgba(0,0,0,0.35);
    }

    .subtitle{
      margin-top:10px;
      font-size:.95rem;
      letter-spacing:.18em;
      color:#a5b4fc;
      text-shadow:0 0 12px rgba(59,130,246,0.18);
    }

    /* ✅ remove the old container spacing so the button can float */
.shell{
  width:min(92vw, 900px);
  min-height:calc(100vh - 48px);
}

/* ✅ floating logo button */
.logoBtn{
  position: relative;
  display:flex;
  align-items:center;
  justify-content:center;

  width: min(560px, 86vw);
  aspect-ratio: 16 / 7;              /* wide floating “plaque” */
  border-radius: 26px;

  background: rgba(8, 14, 30, 0.25); /* barely-there surface */
  border: 1px solid rgba(190, 230, 255, 0.28);

  cursor: pointer;
  appearance:none;
  -webkit-appearance:none;
  outline:none;

  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;

  /* FLOATING + ICE GLOW */
  box-shadow:
    0 14px 40px rgba(0,0,0,0.55),
    0 0 22px rgba(255,255,255,0.20),
    0 0 44px rgba(160, 210, 255, 0.45),
    0 0 88px rgba(90, 170, 255, 0.35);

  animation: icePulse 2.6s ease-in-out infinite;
  transform: translateZ(0);
}

/* glossy sweep + inner frost */
.logoBtn::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;

  background:
    radial-gradient(circle at 50% 35%, rgba(255,255,255,0.22), transparent 55%),
    radial-gradient(circle at 20% 70%, rgba(120,190,255,0.20), transparent 55%),
    radial-gradient(circle at 80% 65%, rgba(170,235,255,0.16), transparent 60%);
  mix-blend-mode: screen;
  opacity: .75;
}

/* thin icy rim that “breathes” */
.logoBtn::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius: calc(26px + 6px);
  pointer-events:none;

  background:
    radial-gradient(circle at 50% 50%,
      rgba(210,240,255,0.35),
      rgba(120,190,255,0.18) 45%,
      transparent 70%);
  filter: blur(10px);
  opacity: .75;
}

/* make the logo BIG */
.logoImg{
  width: min(360px, 70vw);
  height: auto;
  display:block;

  filter:
    drop-shadow(0 0 10px rgba(255,255,255,0.35))
    drop-shadow(0 0 24px rgba(120,190,255,0.55))
    drop-shadow(0 0 52px rgba(90,170,255,0.35));
}

/* pressed state for responsiveness */
.logoBtn:active{
  transform: scale(0.985);
}

/* when your JS adds .pulse (keep same class name behavior) */
.logoBtn.pulse{
  animation: none;
  transform: scale(0.99);

  box-shadow:
    0 18px 48px rgba(0,0,0,0.60),
    0 0 26px rgba(255,255,255,0.30),
    0 0 60px rgba(180, 230, 255, 0.85),
    0 0 120px rgba(90, 170, 255, 0.65);
}
.logoBtn.pulse::after{
  opacity: 1;
}

/* icy blue breathing */
@keyframes icePulse{
  0%,100%{
    filter: saturate(1.08) brightness(1.02);
    box-shadow:
      0 14px 40px rgba(0,0,0,0.55),
      0 0 18px rgba(255,255,255,0.18),
      0 0 40px rgba(160, 210, 255, 0.42),
      0 0 80px rgba(90, 170, 255, 0.32);
  }
  50%{
    filter: saturate(1.25) brightness(1.10);
    box-shadow:
      0 18px 48px rgba(0,0,0,0.58),
      0 0 24px rgba(255,255,255,0.26),
      0 0 62px rgba(180, 230, 255, 0.75),
      0 0 120px rgba(90, 170, 255, 0.55);
  }
}

    /* ✅ Logo Button — ICE BLUE CORE */
.game-link.one5zero{
  display:block;
  width:100%;
  text-align:center;

  padding:26px 18px;
  border-radius:18px;

  background:
    radial-gradient(circle at top,
      rgba(180,220,255,0.35),
      rgba(20,30,60,0.95)
    );

  border:2px solid rgba(180,220,255,0.75);

  box-shadow:
    0 0 18px rgba(255,255,255,0.95),
    0 0 36px rgba(180,220,255,0.85),
    0 0 60px rgba(120,190,255,0.75),
    0 12px 28px rgba(0,0,0,0.55);

  position:relative;
  overflow:hidden;

  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;

  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  background-clip:padding-box;
}


    .game-link.one5zero:focus{ outline:none; }

    .game-link.one5zero .en{
      display:block;
      font-family:'Orbitron', system-ui, sans-serif;
      font-weight:900;
      letter-spacing:.22em;
      font-size:1.45rem;
      color:#0b1220;
    }

    .game-link.one5zero .jp{
      display:block;
      margin-top:8px;
      font-family:'Noto Sans JP', system-ui, sans-serif;
      font-weight:700;
      font-size:.78rem;
      letter-spacing:.18em;
      color:#0b1220;
      opacity:.9;
      text-shadow:0 0 10px rgba(255,255,255,0.55);
    }

    @keyframes floatGlow{
      0%   { transform:translate3d(-34%,-8%,0) scale(1); opacity:.45; }
      50%  { transform:translate3d(14%,6%,0)  scale(1.12); opacity:.75; }
      100% { transform:translate3d(-34%,-8%,0) scale(1); opacity:.45; }
    }

    .game-link.one5zero::after{
      content:"";
      position:absolute;
      inset:-45%;
      background:radial-gradient(circle,
      rgba(200,230,255,0.55),
      rgba(120,180,255,0.25) 40%,
      transparent 65%
    );

      filter:blur(12px);
      opacity:.55;
      transform:translate3d(-30%, -10%, 0);
      animation:floatGlow 3.2s ease-in-out infinite;
      pointer-events:none;
    }

    .game-link.one5zero.pulse{
  transform:scale(.985);
  filter:brightness(1.12) saturate(1.35);
  box-shadow:
    0 0 18px rgba(255,255,255,0.95),
    0 0 36px rgba(180,220,255,0.85),
    0 0 60px rgba(120,190,255,0.75),
    0 0 96px rgba(80,160,255,0.65),
    0 14px 34px rgba(0,0,0,0.55);
}


    .game-link.one5zero.pulse::after{
      animation:none;
      opacity:.95;
      transform:translate3d(10%,6%,0) scale(1.35);
    }

    .bottom{
      width:100%;
      text-align:center;
      font-family:'Orbitron', system-ui, sans-serif;
      font-weight:900;
      font-size:.88rem;
      opacity:.86;
      padding-bottom:4px;
      letter-spacing:.14em;
      text-shadow:0 0 10px rgba(248,250,252,0.25);
    }

    @media (max-width:380px){
      .title{ font-size:2.45rem; }
    }
    
    .logo150{
  width: min(260px, 72vw);
  height: auto;
  display: block;
  margin: 0 auto;
  filter:
    drop-shadow(0 0 10px rgba(180,220,255,.65))
    drop-shadow(0 0 22px rgba(120,190,255,.45));
}

    
  </style>
</head>

<body>
  <div class="shell">

    <div class="top">
      <div class="title-wrap">
        <div class="title">BOOHA BLOCKS</div>
      </div>
      <div class="subtitle">ブーハー・ブロックス</div>
    </div>

   <!-- ✅ FLOATING LOGO BUTTON (no container card) -->
<button class="logoBtn" id="one5zeroBtn" type="button" data-href="./booha-blocks/" aria-label="ONE 5 ZERO">
  <img src="150.png" alt="ONE 5 ZERO" class="logoImg">
</button>


    <div class="bottom">Bryan's English School</div>
  </div>

  <script>
    (async function () {
      const API_BASE = 'https://www.bryanharper.tokyo';
      const GATE_URL = 'https://www.bryanharper.tokyo/booha-gate';

      const MSG = {
        kicked: {
          en: "Someone just logged in using your name and PIN.",
          jp: "別の端末であなたの名前とPINでログインされました。"
        },
        expired: {
          en: "Your session has expired. Please log in again.",
          jp: "セッションの有効期限が切れました。もう一度ブーハーゲートからログインしてください。"
        },
        invalid: {
          en: "Your session is invalid. Please log in again.",
          jp: "セッションの確認に問題が発生しました。もう一度ブーハーゲートからログインしてください。"
        },
        missing: {
          en: "No session found. Please log in through the Booha Gate.",
          jp: "セッションが見つかりません。ブーハーゲートからログインしてください。"
        }
      };

      function kickOut(kind) {
        const m = MSG[kind] || MSG.invalid;
        alert(m.en + "\n\n" + m.jp);
        window.location.href = GATE_URL;
      }

      const params = new URLSearchParams(window.location.search);
      let token = params.get('token');

      if (!token) {
        try { token = sessionStorage.getItem('boohaToken'); } catch {}
      }

      if (!token) {
        kickOut('missing');
        return;
      }

      try {
        const res = await fetch(
          API_BASE + '/_functions/verifyToken?token=' + encodeURIComponent(token),
          { headers: { 'Accept': 'application/json' } }
        );

        const data = await res.json();

        if (!data.valid) {
          if (data.reason === "KICKED" || data.isActive === false) kickOut('kicked');
          else if (data.reason === "EXPIRED" || data.expired) kickOut('expired');
          else kickOut('invalid');
          return;
        }

        try { sessionStorage.setItem('boohaToken', token); } catch {}

        // ✅ append token to ALL internal hrefs AND buttons with data-href
        // anchors:
        document.querySelectorAll('a').forEach(a => {
          const raw = a.getAttribute('href');
          if (!raw) return;
          if (raw.startsWith('#')) return;
          if (raw.startsWith('http')) return;
          const u = new URL(raw, window.location.href);
          if (!u.searchParams.get('token')) u.searchParams.set('token', token);
          a.setAttribute('href', u.pathname + u.search + u.hash);
        });

        // buttons:
        document.querySelectorAll('[data-href]').forEach(el=>{
          const raw = el.getAttribute('data-href');
          if(!raw) return;
          if (raw.startsWith('#')) return;
          if (raw.startsWith('http')) return;
          const u = new URL(raw, window.location.href);
          if (!u.searchParams.get('token')) u.searchParams.set('token', token);
          el.setAttribute('data-href', u.pathname + u.search + u.hash);
        });

      } catch (err) {
        console.error('[Booha Blocks Index] token verification error:', err);
        kickOut('invalid');
      }
    })();
  </script>

  <!-- ✅ play SFX immediately, open EXACTLY 4 seconds later -->
  <script>
    (function(){
      const btn = document.getElementById("one5zeroBtn");
      if(!btn) return;

      const OPEN_DELAY_MS = 4000;
      let locked = false;

      function playIndexSfx(){
        try{
          const a = new Audio("index.mp3"); // fresh instance (Safari-safe)
          a.currentTime = 0;
          a.play().catch(()=>{});
        }catch(e){}
      }

      function go(){
        if(locked) return;
        locked = true;

        const href = btn.getAttribute("data-href") || "./booha-blocks/";

        btn.classList.add("pulse");
        playIndexSfx();

        setTimeout(()=>{
          window.location.assign(href);
        }, OPEN_DELAY_MS);
      }

      btn.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        e.stopPropagation();
        go();
      }, { passive:false });

      // also block click (some devices navigate on click after pointerdown)
      btn.addEventListener("click", (e)=>{
        e.preventDefault();
        e.stopPropagation();
      }, { passive:false });

      btn.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          go();
        }
      });
    })();
  </script>

</body>
</html>
